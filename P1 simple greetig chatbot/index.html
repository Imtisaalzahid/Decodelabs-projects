<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rule-Based AI Chatbot 🤖</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar with Rules & Information -->
        <aside class="sidebar">
            <div class="brand">
                <div class="bot-avatar-large">🤖</div>
                <h2>Rule Bot AI</h2>
                <span class="badge">Rule-Based Engine</span>
            </div>

            <div class="sidebar-section">
                <h3>📋 Project Specs</h3>
                <ul class="specs-list">
                    <li><span class="icon">✨</span> <strong>Control Flow:</strong> If-Else Decision Logic</li>
                    <li><span class="icon">👋</span> <strong>Greetings:</strong> Auto-recognized</li>
                    <li><span class="icon">🚪</span> <strong>Exit Command:</strong> 'bye', 'exit', 'quit'</li>
                    <li><span class="icon">🔄</span> <strong>Execution:</strong> Continuous Loop</li>
                </ul>
            </div>

            <div class="sidebar-section">
                <h3>💡 Suggested Prompts</h3>
                <div class="tags-container" id="suggestedTags">
                    <button class="tag-btn" onclick="sendSuggested('Hello!')">Hello!</button>
                    <button class="tag-btn" onclick="sendSuggested('How are you?')">How are you?</button>
                    <button class="tag-btn" onclick="sendSuggested('What is your name?')">What is your name?</button>
                    <button class="tag-btn" onclick="sendSuggested('What can you do?')">What can you do?</button>
                    <button class="tag-btn" onclick="sendSuggested('Help')">Help</button>
                    <button class="tag-btn" onclick="sendSuggested('Tell me a joke')">Tell me a joke</button>
                    <button class="tag-btn" onclick="sendSuggested('Bye')">Bye</button>
                </div>
            </div>

            <div class="sidebar-footer">
                <button id="clearChatBtn" class="secondary-btn">🗑️ Clear Conversation</button>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-container">
            <header class="chat-header">
                <div class="active-status">
                    <span class="status-dot"></span>
                    <div>
                        <h3>Rule-Based Assistant</h3>
                        <p id="botStatus">Online & Ready</p>
                    </div>
                </div>
                <div class="header-actions">
                    <button id="restartBtn" class="icon-btn" title="Restart Session">🔄 Restart Session</button>
                </div>
            </header>

            <div class="chat-messages" id="chatMessages">
                <!-- Messages will be injected here -->
            </div>

            <div class="chat-input-container">
                <form id="chatForm" onsubmit="handleSendMessage(event)">
                    <input 
                        type="text" 
                        id="userInput" 
                        placeholder="Type a message (e.g., 'hello', 'how are you', 'bye')..." 
                        autocomplete="off"
                        required
                    />
                    <button type="submit" id="sendBtn">
                        <span>Send</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
                        </svg>
                    </button>
                </form>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
